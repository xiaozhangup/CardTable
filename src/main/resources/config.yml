# 牌桌位置在 tables.yml；不同游戏通过 GameProvider 注册。
turn-seconds: 30
max-distance: 12.0
max-multiplier: 64
voice: true
# 斗地主录音声线：female 女声 / male 男声。
doudizhu-voice: female
music: true
# 默认自动下载 Python 与规则 AI 到插件目录 env，后续启动复用；无需安装 Python。
# 初次准备在后台进行，日志位于 env/setup.log 和 env/process.log。
ai:
  enabled: true
  mode: managed
  # 仅 mode: external 使用此命令；不经过 shell，{data} 为插件数据目录。
  command: []
# 座椅内置原版坐姿，不需要其他坐下插件。
default-skin: classic
skin-prefixes:
  classic: 'doudizhu:classic_'
  jade: 'doudizhu:jade_'
